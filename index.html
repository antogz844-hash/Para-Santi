<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Santino 🤎</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Georgia,serif;
background:#f7f0e8;
color:#5d4037;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:30px;
background:linear-gradient(#f7f0e8,#efe3d6);
}

h1{
font-size:55px;
margin-bottom:15px;
}

p{
font-size:22px;
max-width:600px;
line-height:1.8;
}

button{
margin-top:40px;
padding:18px 40px;
border:none;
border-radius:50px;
background:#e7cfcf;
font-size:20px;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
transition:.3s;
}

</style>
</head>

<body>

<section class="hero">

<h1>Santino 🤎</h1>

<p>
Nuestra historia merece un lugar que dure para siempre.
</p>

<p style="margin-top:20px;">
03 • 08 • 2023
</p>

<button>
Entrar ❤️
</button>

</section>

</body>
</html>
